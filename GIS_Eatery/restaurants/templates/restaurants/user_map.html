<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="origin">
    <title>Bản đồ Thông minh - GIS Eatery</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Arial, sans-serif; background: #f6f6f6; }
        #map { height: 100%; width: 100%; }
        .control-panel {
            position: absolute; top: 20px; right: 20px; z-index: 1000;
            background: #fff; padding: 18px 16px 12px 16px; border-radius: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.13); width: 320px;
            max-height: 90vh; overflow-y: auto;
        }
        .control-panel h4 { margin-top: 0; color: #cf2127; font-size: 20px; font-weight: bold; }
        .btn-scan {
            width: 100%; background: #cf2127; color: white; border: none;
            padding: 11px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; font-size: 15px;
            transition: background 0.2s;
        }
        .btn-scan:hover { background: #b01b20; }
        .popup-img { width: 100%; height: 110px; object-fit: cover; border-radius: 6px; margin-bottom: 5px; }
        .btn-route {
            background: #28a745; color: white; border: none; padding: 6px 12px;
            border-radius: 4px; cursor: pointer; width: 100%; margin-top: 5px; font-size: 14px;
        }
        #resultsList {
            max-height: 260px;
            overflow-y: auto;
            margin-top: 10px;
            margin-bottom: 0;
        }
        .result-item {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
            margin-bottom: 10px;
            padding: 10px 10px 10px 10px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
            transition: box-shadow 0.2s, border 0.2s;
            border-left: 4px solid #cf2127;
            cursor: pointer;
        }
        .result-item:hover {
            box-shadow: 0 4px 16px rgba(207,33,39,0.13);
            border-left: 4px solid #28a745;
        }
        .result-thumb {
            width: 60px; height: 60px; border-radius: 6px; object-fit: cover; background: #eee;
            flex-shrink: 0;
        }
        .result-info {
            flex: 1;
        }
        .result-title {
            font-size: 15px; font-weight: bold; color: #cf2127; margin-bottom: 2px;
        }
        .result-address {
            font-size: 13px; color: #666; margin-bottom: 4px;
        }
        .result-distance {
            display: inline-block; background: #28a745; color: #fff; font-size: 12px;
            border-radius: 10px; padding: 2px 8px; margin-bottom: 4px;
        }
        .result-actions {
            display: flex; gap: 6px; margin-top: 6px;
        }
        .btn-detail {
            background: #cf2127; color: #fff; border: none; border-radius: 4px; padding: 5px 10px; font-size: 13px; font-weight: 500; flex: 1; text-align: center; text-decoration: none;
            transition: background 0.2s;
        }
        .btn-detail:hover { background: #a61820; }
        .btn-route {
            background: #007bff; color: #fff; border: none; border-radius: 4px; padding: 5px 10px; font-size: 13px; font-weight: 500; flex: 1; text-align: center; text-decoration: none;
            transition: background 0.2s;
        }
        .btn-route:hover { background: #0056b3; }
    </style>
</head>
<body>

    <div class="control-panel">
        <h4><i class="fas fa-radar"></i> Tìm quanh đây</h4>
        
        <label>Bán kính (km):</label>
        <input type="number" id="radius" class="form-control" value="2" min="1" max="50" style="width: 100%; padding: 5px; margin-bottom: 5px;">
        <small class="text-muted">Nhập số km muốn quét</small>

        <button class="btn-scan" onclick="scanNearby()">
            <i class="fas fa-search-location"></i> QUÉT QUÁN ĂN
        </button>
        
        <hr>
        <div id="status">Đang đợi vị trí...</div>
        <button id="stopRoutingBtn" onclick="stopRouting()" style="display:none; width:100%; background:#ffc107; color:#333; border:none; padding:8px; border-radius:5px; margin:8px 0 0 0; font-weight:bold;">
            <i class="fas fa-times"></i> Dừng chỉ đường
        </button>
        <div id="resultsList"></div>
        <a href="{% url 'index' %}" style="display:block; text-align:center; margin-top:10px; text-decoration:none;">Quay lại Trang chủ</a>
    </div>

    <div id="map"></div>

<script>
    // 1. Khởi tạo bản đồ
    var map = L.map('map').setView([10.7626, 106.6602], 13);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
        subdomains: 'abcd',
        maxZoom: 20
    }).addTo(map);

    var userMarker = null;
    var searchCircle = null;
    var markersLayer = L.layerGroup().addTo(map); // Layer chứa các quán ăn
    var routingControl = null; // Biến lưu đường đi
    var userLat = null, userLng = null;

    // 2. Lấy vị trí người dùng (GPS trình duyệt)
    map.locate({setView: true, maxZoom: 14});

    map.on('locationfound', function(e) {
        userLat = e.latlng.lat;
        userLng = e.latlng.lng;
        
        document.getElementById('status').innerText = "📍 Đã thấy bạn!";
        
        // Vẽ marker người dùng
        if (userMarker) map.removeLayer(userMarker);
        userMarker = L.marker(e.latlng, {
            icon: L.divIcon({
                className: 'user-icon',
                html: '<i class="fas fa-user-circle" style="font-size:30px; color:blue; background:white; border-radius:50%;"></i>',
                iconSize: [30, 30]
            })
        }).addTo(map).bindPopup("Bạn đang ở đây").openPopup();
    });

    map.on('locationerror', function(e) {
        document.getElementById('status').innerText = "⚠️ Không lấy được vị trí GPS.";
        alert("Vui lòng bật GPS trình duyệt!");
    });

    // 3. Hàm QUÉT QUÁN ĂN (Radius Search)
    function scanNearby() {
        if (!userLat) return alert("Chưa có vị trí của bạn!");
        var radiusKm = document.getElementById('radius').value;
        var radiusMeters = radiusKm * 1000;
        document.getElementById('status').innerText = `🔄 Đang quét trong ${radiusKm}km...`;
        if (searchCircle) map.removeLayer(searchCircle);
        searchCircle = L.circle([userLat, userLng], {
            color: 'red', fillColor: '#f03', fillOpacity: 0.1, radius: radiusMeters
        }).addTo(map);
        map.fitBounds(searchCircle.getBounds());
        fetch(`/api/nearby/?lat=${userLat}&lng=${userLng}&radius=${radiusKm}`)
            .then(res => res.json())
            .then(data => {
                markersLayer.clearLayers();
                let html = '';
                if (data.length === 0) {
                    document.getElementById('status').innerText = "❌ Không tìm thấy quán nào.";
                    document.getElementById('resultsList').innerHTML = '';
                    return;
                }
                document.getElementById('status').innerText = `✅ Tìm thấy ${data.length} quán!`;
                window._popupMarkerMap = {};
                html = data.map(r => {
                    var imgHtml = r.image ? `<img src='${r.image}' class='result-thumb'>` : `<div class='result-thumb'></div>`;
                    return `<div class='result-item' onmouseenter='showMarkerPopup(${r.id})'>
                        ${imgHtml}
                        <div class='result-info'>
                            <div class='result-title'>${r.name}</div>
                            <div class='result-address'><i class='fas fa-map-marker-alt text-danger'></i> ${r.address}</div>
                            <div class='result-distance'>${r.distance} km</div>
                            <div class='result-actions'>
                                <a href='/restaurant/${r.id}/' class='btn-detail'>Chi tiết</a>
                                <a href='javascript:getDirections(${r.lat},${r.lng})' class='btn-route'>Chỉ đường</a>
                            </div>
                        </div>
                    </div>`;
                }).join('');
                document.getElementById('resultsList').innerHTML = html;
                data.forEach(r => {
                    var imgHtml = r.image ? `<img src="${r.image}" class="popup-img">` : '';
                    var popupContent = `
                        ${imgHtml}
                        <b>${r.name}</b><br>
                        <i class="fas fa-map-marker-alt text-danger"></i> ${r.address}<br>
                        <small>Cách bạn: <b>${r.distance} km</b></small>
                        <hr style="margin:5px 0">
                        <button class="btn-route" onclick="getDirections(${r.lat}, ${r.lng})">
                            <i class="fas fa-directions"></i> Chỉ đường ngay
                        </button>
                    `;
                    var marker = L.marker([r.lat, r.lng]).addTo(markersLayer).bindPopup(popupContent);
                    window._popupMarkerMap = window._popupMarkerMap || {};
                    window._popupMarkerMap[r.id] = marker;
                });
            })
            .catch(err => console.error(err));
    }

    // 4. Hàm CHỈ ĐƯỜNG (Routing)
    function getDirections(destLat, destLng) {
        if (!userLat) return alert("Cần vị trí của bạn để chỉ đường!");
        if (routingControl) {
            map.removeControl(routingControl);
        }
        routingControl = L.Routing.control({
            waypoints: [
                L.latLng(userLat, userLng),
                L.latLng(destLat, destLng)
            ],
            routeWhileDragging: false,
            language: 'en',
            showAlternatives: true,
            lineOptions: {
                styles: [{color: 'blue', opacity: 0.6, weight: 5}]
            },
            createMarker: function() { return null; }
        }).addTo(map);
        document.getElementById('stopRoutingBtn').style.display = 'block';
        map.closePopup();
    }

    function stopRouting() {
        if (routingControl) {
            map.removeControl(routingControl);
            routingControl = null;
        }
        document.getElementById('stopRoutingBtn').style.display = 'none';
    }

    function showMarkerPopup(id) {
        if (window._popupMarkerMap && window._popupMarkerMap[id]) {
            window._popupMarkerMap[id].openPopup();
        }
    }
</script>

</body>
</html>
