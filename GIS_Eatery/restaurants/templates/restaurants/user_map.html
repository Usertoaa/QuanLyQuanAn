<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bản đồ Quán ăn & Đặt bàn</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #map { height: 100vh; width: 100%; }
        
        /* Style cho Popup đẹp hơn */
        .popup-content { min-width: 250px; }
        .popup-content h3 { margin-top: 0; color: #d9534f; }
        .popup-content p { margin: 5px 0; font-size: 14px; }
        .booking-form { background: #f9f9f9; padding: 10px; border-radius: 5px; border: 1px solid #ddd; margin-top: 10px; }
        .booking-form input { width: 100%; padding: 8px; margin-bottom: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .booking-form button { width: 100%; background-color: #28a745; color: white; padding: 8px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .booking-form button:hover { background-color: #218838; }
        .msg-box { margin-top: 8px; font-weight: bold; font-size: 13px; text-align: center; }
    </style>
</head>
<body>

<div id="map"></div>

<script>
    // 1. Khởi tạo bản đồ (TP.HCM)
    var map = L.map('map').setView([10.7626, 106.6602], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // 2. Gọi API để lấy danh sách quán ăn
    fetch('/restaurants/api/restaurants/')
        .then(response => response.json())
        .then(data => {
            // 3. Hiển thị dữ liệu GeoJSON lên bản đồ
            L.geoJSON(data, {
                onEachFeature: function (feature, layer) {
                    // Lấy ID của quán
                    // Lưu ý: Nếu GeoJSON của bạn ID nằm ở properties.pk thì sửa thành feature.properties.pk
                    // Mặc định Django serialize 'geojson' sẽ để ID ở feature.id
                    var restaurantId = feature.id; 

                    // Nội dung HTML của Popup
                    var content = `
                        <div class="popup-content">
                            <h3>🍽️ ${feature.properties.name}</h3>
                            <p>📍 ${feature.properties.address}</p>
                            <hr>
                            <div id="form-container-${restaurantId}">
                                <b>Đặt bàn nhanh:</b>
                                <form class="booking-form" onsubmit="submitBooking(event, ${restaurantId})">
                                    <input type="text" name="name" placeholder="Tên của bạn" required>
                                    <input type="datetime-local" name="time" required>
                                    <button type="submit">Xác nhận đặt bàn</button>
                                </form>
                            </div>
                            <p id="msg-${restaurantId}" class="msg-box"></p>
                        </div>
                    `;
                    layer.bindPopup(content);
                }
            }).addTo(map);
        })
        .catch(error => console.error('Lỗi tải dữ liệu:', error));

    // 4. Hàm xử lý khi bấm nút Đặt bàn
    function submitBooking(e, restaurantId) {
        e.preventDefault(); // Chặn trang web load lại
        
        var form = e.target;
        var formData = new FormData(form);
        formData.append('restaurant_id', restaurantId);

        // Gửi dữ liệu sang API đặt bàn
        fetch('/restaurants/api/book/', {
            method: 'POST',
            body: formData
        })
        .then(res => res.json())
        .then(data => {
            var msgBox = document.getElementById(`msg-${restaurantId}`);
            
            if (data.status === 'success') {
                msgBox.style.color = 'green';
                msgBox.innerText = "✅ " + data.message;
                // Ẩn form đi sau khi đặt thành công
                document.getElementById(`form-container-${restaurantId}`).style.display = 'none';
            } else {
                msgBox.style.color = 'red';
                msgBox.innerText = "❌ " + data.message;
            }
        })
        .catch(err => alert("Lỗi kết nối đến server!"));
    }
</script>

</body>
</html>
