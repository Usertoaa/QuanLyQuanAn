<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin System - GIS Eatery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --sidebar-width: 260px;
        }
        body { background-color: #f4f6f9; overflow-x: hidden; }
        /* Sidebar Styling */
        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: #212529;
            color: #fff;
            transition: transform 0.3s ease;
            z-index: 1040;
            overflow-y: auto;
        }
        .sidebar-header { padding: 20px; background: #cf2127; font-weight: bold; text-align: center; font-size: 1.2rem; }
        .nav-link { color: #babbbc; padding: 15px 20px; border-bottom: 1px solid #343a40; display: block; text-decoration: none;}
        .nav-link:hover, .nav-link.active { color: #fff; background: #343a40; border-left: 4px solid #cf2127; }
        .nav-link i { width: 30px; }
        
        /* Main Content */
        .content {
            margin-left: var(--sidebar-width);
            padding: 30px;
            transition: all 0.3s;
            min-width: 0;
        }
        .card { border: none; box-shadow: 0 0 15px rgba(0,0,0,0.05); border-radius: 8px; margin-bottom: 20px; }
        .card-header { background: #fff; border-bottom: 1px solid #eee; font-weight: bold; padding: 15px 20px; }
        
        /* Stats Box */
        .stat-box { padding: 20px; border-radius: 8px; color: white; position: relative; overflow: hidden; }
        .stat-box h3 { margin: 0; font-size: 2.5rem; font-weight: bold; }
        .stat-box p { margin: 0; opacity: 0.8; }
        .stat-icon { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); font-size: 3rem; opacity: 0.2; }

        .mobile-menu-toggle {
            display: none;
            position: fixed;
            top: 12px;
            left: 12px;
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 10px;
            background: #cf2127;
            color: #fff;
            z-index: 1060;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
        }
        .sidebar-overlay {
            display: none;
        }

        @media (max-width: 991.98px) {
            .mobile-menu-toggle {
                display: inline-flex;
            }
            .sidebar {
                transform: translateX(-100%);
                box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
            }
            body.sidebar-open .sidebar {
                transform: translateX(0);
            }
            .sidebar-overlay {
                display: block;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.46);
                opacity: 0;
                visibility: hidden;
                transition: opacity 0.25s ease;
                z-index: 1035;
            }
            body.sidebar-open .sidebar-overlay {
                opacity: 1;
                visibility: visible;
            }
            .content {
                margin-left: 0;
                padding: 68px 14px 16px;
            }
            .content h1, .content h2 {
                font-size: 1.9rem;
                line-height: 1.2;
                word-break: break-word;
            }
            .content .table-responsive {
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>

    <button class="mobile-menu-toggle" id="mobileMenuBtn" type="button" aria-label="Mở menu quản trị">
        <i class="fas fa-bars"></i>
    </button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="sidebar">
        <div class="sidebar-header"><i class="fas fa-map-marker-alt"></i> GIS ADMIN</div>
        
        <nav class="mt-3">
            <a href="{% url 'admin_dashboard' %}" class="nav-link {% if active_page == 'dashboard' %}active{% endif %}">
                <i class="fas fa-tachometer-alt"></i> Tổng quan
            </a>
            <a href="{% url 'admin_restaurant_list' %}" class="nav-link {% if active_page == 'restaurants' %}active{% endif %}">
                <i class="fas fa-plus-circle"></i> Quản lý Quán Ăn
            </a>
            <a href="{% url 'admin_amenity_list' %}" class="nav-link {% if active_page == 'amenities' %}active{% endif %}">
                <i class="fas fa-tags"></i> Quản lý Tiện Ích
            </a>
            <a href="{% url 'admin_reservations' %}" class="nav-link {% if active_page == 'reservations' %}active{% endif %}">
                <i class="fas fa-list-alt"></i> Quản lý Đặt bàn
            </a>
            <a href="{% url 'admin_user_accounts' %}" class="nav-link {% if active_page == 'accounts' %}active{% endif %}">
                <i class="fas fa-users"></i> Quản lý Tài khoản
            </a>
            <a href="{% url 'admin_all_feedbacks' %}" class="nav-link {% if active_page == 'all_feedbacks' %}active{% endif %}">
                <i class="fas fa-comments"></i> Tất cả phản hồi
            </a>
            <a href="{% url 'index' %}" class="nav-link mt-5 border-top border-secondary">
                <i class="fas fa-arrow-left"></i> Về Trang chủ
            </a>
        </nav>
    </div>

    <div class="content">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        (function () {
            const menuBtn = document.getElementById('mobileMenuBtn');
            const overlay = document.getElementById('sidebarOverlay');
            const navLinks = document.querySelectorAll('.sidebar .nav-link');

            function closeSidebar() {
                document.body.classList.remove('sidebar-open');
            }

            function toggleSidebar() {
                document.body.classList.toggle('sidebar-open');
            }

            if (menuBtn) {
                menuBtn.addEventListener('click', toggleSidebar);
            }

            if (overlay) {
                overlay.addEventListener('click', closeSidebar);
            }

            navLinks.forEach((link) => {
                link.addEventListener('click', function () {
                    if (window.matchMedia('(max-width: 991.98px)').matches) {
                        closeSidebar();
                    }
                });
            });

            window.addEventListener('resize', function () {
                if (window.innerWidth > 991) {
                    closeSidebar();
                }
            });
        })();
    </script>
    
    {% block scripts %}
    {% endblock %}
</body>
</html>
